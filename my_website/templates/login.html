<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Login — MyDrive</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f1117;--surface:#181c26;--border:#2a2f3d;--accent:#4ade80;--text:#e2e8f0;--muted:#4a5568;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;color:var(--text);}
    .wrap{width:100%;max-width:380px;padding:20px;}
    .logo{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;color:var(--accent);margin-bottom:40px;}
    .logo span{color:var(--muted);}
    h1{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;font-weight:600;margin-bottom:6px;}
    .sub{color:var(--muted);font-size:0.85rem;margin-bottom:32px;}
    label{display:block;font-size:0.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
    input{width:100%;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:0.9rem;margin-bottom:20px;outline:none;transition:border-color .15s;}
    input:focus{border-color:var(--accent);}
    button{width:100%;padding:12px;background:var(--accent);border:none;border-radius:6px;color:#0f1117;font-family:'IBM Plex Mono',monospace;font-size:0.9rem;font-weight:600;cursor:pointer;transition:opacity .15s;}
    button:hover{opacity:.88;}
    .error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:10px 14px;border-radius:6px;font-size:0.82rem;margin-bottom:20px;font-family:'IBM Plex Mono',monospace;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">my<span>/</span>drive</div>
    <h1>Sign in</h1>
    <p class="sub">Enter your credentials to continue</p>
    {% if error %}<div class="error">⚠ {{ error }}</div>{% endif %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="username" required autofocus />
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required />
      <button type="submit">Login →</button>
    </form>
  </div>
</body>
</html>
