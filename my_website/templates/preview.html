<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Preview — {{ filename }}</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f1117;--surface:#181c26;--border:#2a2f3d;--accent:#4ade80;--text:#e2e8f0;--muted:#4a5568;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);min-height:100vh;font-family:'IBM Plex Sans',sans-serif;color:var(--text);}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 28px;border-bottom:1px solid var(--border);background:var(--surface);}
    .logo{font-family:'IBM Plex Mono',monospace;font-size:1rem;color:var(--accent);}
    .logo span{color:var(--muted);}
    .back{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:5px 14px;border-radius:6px;transition:color .15s;}
    .back:hover{color:var(--accent);}
    .main{max-width:960px;margin:40px auto;padding:0 20px;}
    h1{font-family:'IBM Plex Mono',monospace;font-size:1rem;margin-bottom:20px;word-break:break-all;}
    pre{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;font-family:'IBM Plex Mono',monospace;font-size:0.8rem;line-height:1.7;white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:75vh;}
    .dl{display:inline-block;margin-top:16px;padding:9px 20px;background:var(--accent);color:#0f1117;font-family:'IBM Plex Mono',monospace;font-size:0.82rem;font-weight:600;border-radius:6px;text-decoration:none;}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">my<span>/</span>drive</div>
    <a href="javascript:history.back()" class="back">← Back</a>
  </div>
  <div class="main">
    <h1>📝 {{ filename }}</h1>
    <pre>{{ content }}</pre>
    <a href="/download/{{ rel }}" class="dl">↓ Download file</a>
  </div>
</body>
</html>
